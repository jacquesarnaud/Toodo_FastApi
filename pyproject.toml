[project]
name = "todoo-fastapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jacquesarnaud", email = "jaarnaud4@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "bcrypt==4.0.1",
    "fastapi-pagination>=0.16.0",
    "fastapi[standard]>=0.141.1",
    "passlib>=1.7.4",
    "psycopg2-binary>=2.9.13",
    "python-jose>=3.5.0",
    "sqlalchemy>=2.0.54",
]

[project.scripts]
todoo-fastapi = "todoo_fastapi:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"
